[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaser"
version = "0.1.0"
description = "A weekly-close agent for freelancers: reconciles payments, chases overdue invoices, and asks you only before anything reaches a client."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ritwika Kancharla" }]
dependencies = [
    "strands-agents>=1.55.0",
    "strands-agents-tools>=0.8.8",
    "bedrock-agentcore>=1.22.0",
    "aws-opentelemetry-distro",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "boto3",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "botocore[crt]"]
anthropic = ["strands-agents[anthropic]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", ".data", "agentcore/.cli"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]
