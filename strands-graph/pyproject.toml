[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chaser-web"
version = "0.1.0"
description = "Web UI for Chaser: a decision inbox that calls the weekly-close agent on Amazon Bedrock AgentCore."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ritwika Kancharla" }]
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "pydantic>=2",
    "boto3",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["httpx", "ruff"]

[tool.fastapi]
# FastAPI Cloud deploys the whole repo from the root (leave the console's
# "Application Directory" blank/root). The FastAPI app is app/server.py; name
# the entrypoint explicitly so auto-discovery does not misfire.
entrypoint = "app.server:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "recongraph"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]
