[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ReconGraphAgent"
version = "0.1.0"
description = "Weekly-close agent (Chaser) on AgentCore Runtime, Strands multi-agent Graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.55.0",
    "strands-agents-tools>=0.8.8",
    "bedrock-agentcore>=1.22.0",
    "aws-opentelemetry-distro",
    "botocore[crt]>=1.35.0",
    "pydantic>=2",
    "boto3",
    "pyyaml",
    "python-dotenv",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
anthropic = ["strands-agents[anthropic]"]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
